services:
  api:
    # everything in .env will be made available as env variable to app
    env_file: ".env"

    build: ./api
    depends_on:
      db:
        # this prevents race condition where the app is ready before the db
        condition: service_healthy

    # docker compose reads .env automatically, so we can pass in PG variables
    # the URL is then available as env variable for app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${PORT}:${PORT}"

  db:
    image: postgres:18

    environment:
      # initializes a cluster with a superuser named after POSTGRES_USER with POSTGRES_PASSWORD
      # POSTGRES_DB is owned by that user, once the cluster is created, these values are ignored
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      # we mount the named volume to path
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  # declares a named volume managed by docker
  pgdata:
